service: task-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: us-east-1
  
  environment:
    MONGODB_URI: ${env:MONGODB_URI}
    NODE_ENV: ${self:provider.stage}
    
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: '*'
  
  apiGateway:
    shouldStartNameWithService: true
  
  memorySize: 512
  timeout: 30

functions:
  createTask:
    handler: src/handlers/tasks.create
    events:
      - http:
          path: /tasks
          method: post
          cors: true
  
  getTasks:
    handler: src/handlers/tasks.getAll
    events:
      - http:
          path: /tasks
          method: get
          cors: true
  
  getTask:
    handler: src/handlers/tasks.getById
    events:
      - http:
          path: /tasks/{id}
          method: get
          cors: true
  
  updateTask:
    handler: src/handlers/tasks.update
    events:
      - http:
          path: /tasks/{id}
          method: put
          cors: true
  
  deleteTask:
    handler: src/handlers/tasks.deleteTask
    events:
      - http:
          path: /tasks/{id}
          method: delete
          cors: true

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin
  - serverless-offline

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    exclude:
      - aws-sdk
    target: node18
    platform: node
    concurrency: 10
  
  serverless-offline:
    httpPort: 3000
    
  dotenv:
    path: .env.${self:provider.stage, 'dev'}
    basePath: ./
    include:
      - MONGODB_URI